# Battlesnake snake server — nginx → php-fpm via unix socket.
#
# Container exposes 9000. The host publishes 9595 → 9000 so the existing
# Cloudflare named tunnel on the Thelio host can point ingress at
# http://127.0.0.1:9595 without colliding with other :9000 services.

server {
    listen 9000 default_server;
    listen [::]:9000 default_server;

    server_name _;

    root /var/www/public;
    index index.php;

    # Cloudflare drops connections idle > 60s; stay one breath ahead.
    keepalive_timeout 65s;
    client_max_body_size 1m;
    client_body_timeout 5s;
    send_timeout 5s;

    # Don't leak nginx version on 4xx/5xx pages.
    server_tokens off;

    # Single front controller: every request maps to public/index.php.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Match php-fpm request_terminate_timeout.
        fastcgi_read_timeout 5s;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 5s;

        fastcgi_buffer_size 8k;
        fastcgi_buffers 8 8k;
    }

    # Hide hidden files / dotfiles. (Belt-and-suspenders; nothing is served from /var/www anyway.)
    location ~ /\. {
        deny all;
    }
}
